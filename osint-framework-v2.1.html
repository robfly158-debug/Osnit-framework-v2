<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OSINT Framework 2.1</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    :root, [data-theme="dark"] {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-color: #58a6ff;
      --accent-hover: #1f6feb;
      --badge-bg: #21262d;
      --header-bg: #0d1117;
      --success: #238636;
      --warning: #e3b341;
      --danger: #f85149;
    }

    [data-theme="light"] {
      --bg-color: #f6f8fa;
      --card-bg: #ffffff;
      --border-color: #d0d7de;
      --text-main: #1f2328;
      --text-muted: #656d76;
      --accent-color: #0969da;
      --accent-hover: #0550ae;
      --badge-bg: #eaeef2;
      --header-bg: #ffffff;
      --success: #1a7f37;
      --warning: #9a6700;
      --danger: #cf222e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.5rem;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    h1 {
      font-size: 1.75rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .version-tag {
      background-color: var(--success);
      color: #fff;
      font-size: 0.7rem;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.45rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .search-bar {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--accent-color);
    }

    .quick-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.9rem;
    }

    .filter-chip {
      padding: 0.3rem 0.75rem;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .filter-chip:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .filter-chip.active {
      background: var(--accent-hover);
      border-color: var(--accent-color);
      color: #fff;
    }

    .nav-tabs {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.65rem;
      margin: 1.25rem 0 0.75rem 0;
    }

    .tab-btn {
      padding: 0.5rem 0.95rem;
      border-radius: 6px;
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background-color: var(--card-bg);
    }

    .tab-btn.active {
      color: #fff;
      background-color: var(--accent-hover);
      border-color: var(--accent-color);
    }

    .count-badge {
      background: rgba(255,255,255,0.15);
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      font-weight: 600;
    }

    .tab-btn.active .count-badge {
      background: rgba(255,255,255,0.25);
    }

    .sub-tabs {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      margin-bottom: 1.25rem;
      padding-bottom: 0.2rem;
    }

    .sub-tab-btn {
      padding: 0.3rem 0.7rem;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .sub-tab-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .sub-tab-btn.active {
      color: #fff;
      background-color: var(--badge-bg);
      border-color: var(--accent-color);
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.1rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, border-color 0.15s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--text-muted);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.4rem;
    }

    .subcategory-label {
      font-size: 0.7rem;
      color: var(--accent-color);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .fav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.15rem;
      color: var(--text-muted);
      transition: color 0.15s;
      line-height: 1;
    }

    .fav-btn.active {
      color: var(--warning);
    }

    .card-title {
      font-size: 1.05rem;
      color: var(--text-main);
      margin: 0.2rem 0 0.4rem 0;
      font-weight: 600;
    }

    .card-description {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
      line-height: 1.45;
      flex-grow: 1;
    }

    .card-tags {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
    }

    .tag {
      font-size: 0.68rem;
      background-color: var(--badge-bg);
      color: var(--text-main);
      padding: 0.18rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.15s;
    }

    .tag:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 0.7rem;
    }

    .action-link {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .action-link:hover {
      text-decoration: underline;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.5rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .modal h3 {
      margin-bottom: 0.75rem;
      font-size: 1.15rem;
    }

    .modal p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1.25rem;
    }

    .btn {
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent-hover);
      border-color: var(--accent-color);
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .stats-bar {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 1.4rem; }
      .tools-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const initialTools = [
      // Username
      { id: "1", name: "WhatsMyName", category: "Username", subcategory: "Enumeration", description: "Search username presence across 500+ websites.", url: "https://whatsmyname.app/", tags: ["Web", "Free"] },
      { id: "2", name: "Sherlock", category: "Username", subcategory: "CLI Tool", description: "Hunt social media accounts by username from the terminal.", url: "https://github.com/sherlock-project/sherlock", tags: ["Terminal", "Open Source"] },
      { id: "10", name: "Maigret", category: "Username", subcategory: "CLI Tool", description: "Collect a dossier on a person by username across hundreds of sites.", url: "https://github.com/soxoj/maigret", tags: ["Terminal", "Open Source"] },
      { id: "11", name: "Namechk", category: "Username", subcategory: "Availability", description: "Check username availability across many platforms.", url: "https://namechk.com", tags: ["Web", "Free"] },
      { id: "23", name: "Blackbird", category: "Username", subcategory: "CLI Tool", description: "Search usernames and emails across social networks and sites.", url: "https://github.com/p1ngul1n0/blackbird", tags: ["Terminal", "Open Source"] },

      // Email
      { id: "3", name: "Epieos", category: "Email", subcategory: "Reverse Lookup", description: "Find connected accounts linked to an email without triggering notifications.", url: "https://epieos.com", tags: ["Web", "Freemium"] },
      { id: "4", name: "Have I Been Pwned", category: "Email", subcategory: "Breach Check", description: "Check if an email address has been exposed in a data breach.", url: "https://haveibeenpwned.com", tags: ["Web", "Free"] },
      { id: "12", name: "Holehe", category: "Email", subcategory: "CLI Tool", description: "Check if an email is used on many sites (registration detection).", url: "https://github.com/megadose/holehe", tags: ["Terminal", "Open Source"] },
      { id: "13", name: "Hunter.io", category: "Email", subcategory: "Finder", description: "Find professional email addresses associated with a domain.", url: "https://hunter.io", tags: ["Web", "Freemium"] },
      { id: "24", name: "EmailRep", category: "Email", subcategory: "Reputation", description: "Email address reputation and risk scoring.", url: "https://emailrep.io", tags: ["Web", "Free"] },

      // Domain / IP
      { id: "5", name: "DNSDumpster", category: "Domain / IP", subcategory: "DNS Recon", description: "Discover subdomains, DNS records, and network maps.", url: "https://dnsdumpster.com", tags: ["Web", "Free"] },
      { id: "6", name: "Shodan", category: "Domain / IP", subcategory: "Device Search", description: "Search engine for Internet-connected devices and exposed services.", url: "https://www.shodan.io", tags: ["Web", "API Required", "Freemium"] },
      { id: "14", name: "Censys", category: "Domain / IP", subcategory: "Device Search", description: "Internet-wide scanning and certificate search.", url: "https://search.censys.io", tags: ["Web", "Freemium"] },
      { id: "15", name: "SecurityTrails", category: "Domain / IP", subcategory: "Historical DNS", description: "Historical DNS, WHOIS, and subdomain data.", url: "https://securitytrails.com", tags: ["Web", "Freemium"] },
      { id: "16", name: "crt.sh", category: "Domain / IP", subcategory: "Certificate Transparency", description: "Search Certificate Transparency logs for subdomains.", url: "https://crt.sh", tags: ["Web", "Free"] },
      { id: "25", name: "ViewDNS.info", category: "Domain / IP", subcategory: "DNS Recon", description: "Multiple DNS and IP lookup tools in one place.", url: "https://viewdns.info", tags: ["Web", "Free"] },

      // Geolocation (expanded with shadow analysis tools)
      { id: "8", name: "GeoSpy", category: "Geolocation", subcategory: "AI Geo", description: "AI-driven image location estimation platform.", url: "https://geospy.ai", tags: ["Web", "AI"] },
      { id: "17", name: "PimEyes", category: "Geolocation", subcategory: "Face Search", description: "Reverse face search engine (use responsibly).", url: "https://pimeyes.com", tags: ["Web", "Paid"] },
      { id: "18", name: "Google Lens / Images", category: "Geolocation", subcategory: "Reverse Image", description: "Reverse image search and visual matching.", url: "https://images.google.com", tags: ["Web", "Free"] },
      { id: "19", name: "ExifTool", category: "Geolocation", subcategory: "Metadata", description: "Extract GPS and other metadata from images and files.", url: "https://exiftool.org", tags: ["CLI", "Open Source"] },
      { id: "26", name: "SunCalc", category: "Geolocation", subcategory: "Shadow Analysis", description: "Visualize sun position, azimuth, elevation and shadow length for any location and time.", url: "https://www.suncalc.org", tags: ["Web", "Free"] },
      { id: "27", name: "Bellingcat Shadow Finder", category: "Geolocation", subcategory: "Shadow Analysis", description: "Calculate possible geographic rings from object height, shadow length, date and time.", url: "https://github.com/bellingcat/ShadowFinder", tags: ["Web", "Open Source"] },
      { id: "28", name: "ShadowMap", category: "Geolocation", subcategory: "Shadow Analysis", description: "3D visualization of building shadows at any time of day.", url: "https://app.shadowmap.org", tags: ["Web", "Freemium"] },
      { id: "29", name: "PeakVisor", category: "Geolocation", subcategory: "Skyline", description: "Match mountain skylines and horizons for geolocation.", url: "https://peakvisor.com", tags: ["Web", "Freemium"] },
      { id: "30", name: "Bellingcat OSM Search", category: "Geolocation", subcategory: "Feature Search", description: "Search OpenStreetMap for combinations of features visible in an image.", url: "https://osm-search.bellingcat.com", tags: ["Web", "Free"] },
      { id: "31", name: "Google Earth Pro", category: "Geolocation", subcategory: "Satellite", description: "Historical satellite imagery and 3D terrain for visual matching.", url: "https://www.google.com/earth/versions/", tags: ["Desktop", "Free"] },
      { id: "32", name: "Sentinel Hub / Copernicus", category: "Geolocation", subcategory: "Satellite", description: "Free satellite imagery browser (Sentinel data).", url: "https://browser.dataspace.copernicus.eu", tags: ["Web", "Free"] },
      { id: "33", name: "Mapillary", category: "Geolocation", subcategory: "Street Level", description: "Crowdsourced street-level imagery alternative to Street View.", url: "https://www.mapillary.com", tags: ["Web", "Free"] },
      { id: "34", name: "Yandex Images", category: "Geolocation", subcategory: "Reverse Image", description: "Strong reverse image search, especially useful for faces and non-Western content.", url: "https://yandex.com/images", tags: ["Web", "Free"] },

      // Dark Web / Breaches
      { id: "9", name: "IntelX", category: "Dark Web / Breaches", subcategory: "Search Engine", description: "Search data leaks, pastes, domain records, and Tor archives.", url: "https://intelx.io", tags: ["Web", "API Required"] },
      { id: "20", name: "Dehashed", category: "Dark Web / Breaches", subcategory: "Breach Search", description: "Search leaked credentials and personal data from breaches.", url: "https://dehashed.com", tags: ["Web", "Paid"] },
      { id: "21", name: "Ahmia", category: "Dark Web / Breaches", subcategory: "Tor Search", description: "Search engine for Tor hidden services.", url: "https://ahmia.fi", tags: ["Web", "Free"] },
      { id: "22", name: "OnionSearch", category: "Dark Web / Breaches", subcategory: "CLI Tool", description: "Search engine scraper for .onion sites.", url: "https://github.com/megadose/OnionSearch", tags: ["Terminal", "Open Source"] },

      // Social Media
      { id: "35", name: "Social Searcher", category: "Social Media", subcategory: "Search", description: "Search public social media posts across platforms.", url: "https://www.social-searcher.com", tags: ["Web", "Freemium"] },
      { id: "36", name: "Twint", category: "Social Media", subcategory: "CLI Tool", description: "Twitter/X OSINT scraping tool (historical utility).", url: "https://github.com/twintproject/twint", tags: ["Terminal", "Open Source"] },
      { id: "37", name: "InVID / WeVerify", category: "Social Media", subcategory: "Verification", description: "Browser extension for video and image verification.", url: "https://www.invid-project.eu/tools-and-services/invid-verification-plugin/", tags: ["Extension", "Free"] },

      // Phone
      { id: "38", name: "Truecaller", category: "Phone", subcategory: "Lookup", description: "Caller ID and reverse phone number search.", url: "https://www.truecaller.com", tags: ["Web", "Freemium"] },
      { id: "39", name: "NumLookup", category: "Phone", subcategory: "Lookup", description: "Free reverse phone lookup service.", url: "https://www.numlookup.com", tags: ["Web", "Free"] },

      // People Search
      { id: "40", name: "FastPeopleSearch", category: "People Search", subcategory: "Public Records", description: "US-focused people search using public records.", url: "https://www.fastpeoplesearch.com", tags: ["Web", "Free"] },
      { id: "41", name: "ThatsThem", category: "People Search", subcategory: "Public Records", description: "People, address, and phone search.", url: "https://thatsthem.com", tags: ["Web", "Free"] }
    ];

    function App() {
      const [tools] = useState(initialTools);
      const [activeTab, setActiveTab] = useState("Username");
      const [activeSubTab, setActiveSubTab] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");
      const [theme, setTheme] = useState(() => localStorage.getItem("osint_theme") || "dark");
      const [activeQuickFilters, setActiveQuickFilters] = useState([]);
      const [showExportModal, setShowExportModal] = useState(false);
      const [showImportModal, setShowImportModal] = useState(false);
      const [importText, setImportText] = useState("");
      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem("osint_favs");
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const categories = ["Favorites", "Username", "Email", "Domain / IP", "Geolocation", "Dark Web / Breaches", "Social Media", "Phone", "People Search"];

      const availableSubcategories = useMemo(() => {
        if (activeTab === "Favorites") return [];
        const subCats = tools
          .filter(tool => tool.category === activeTab)
          .map(tool => tool.subcategory);
        return ["All", ...new Set(subCats)];
      }, [tools, activeTab]);

      const categoryCounts = useMemo(() => {
        const counts = {};
        categories.forEach(cat => {
          if (cat === "Favorites") {
            counts[cat] = favorites.length;
          } else {
            counts[cat] = tools.filter(t => t.category === cat).length;
          }
        });
        return counts;
      }, [tools, favorites, categories]);

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("osint_theme", theme);
      }, [theme]);

      useEffect(() => {
        localStorage.setItem("osint_favs", JSON.stringify(favorites));
      }, [favorites]);

      const handleTabChange = (category) => {
        setActiveTab(category);
        setActiveSubTab("All");
      };

      const toggleFavorite = (id) => {
        setFavorites(prev =>
          prev.includes(id) ? prev.filter(favId => favId !== id) : [...prev, id]
        );
      };

      const toggleQuickFilter = (filter) => {
        setActiveQuickFilters(prev =>
          prev.includes(filter) ? prev.filter(f => f !== filter) : [...prev, filter]
        );
      };

      const handleTagClick = (tag) => {
        setSearchQuery(tag);
      };

      const filteredTools = tools.filter(tool => {
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q || 
          tool.name.toLowerCase().includes(q) ||
          tool.description.toLowerCase().includes(q) ||
          tool.subcategory.toLowerCase().includes(q) ||
          tool.tags.some(t => t.toLowerCase().includes(q)) ||
          tool.category.toLowerCase().includes(q);

        if (q) return matchesSearch;

        // Quick filters
        if (activeQuickFilters.length > 0) {
          const tagSet = tool.tags.map(t => t.toLowerCase());
          const passes = activeQuickFilters.every(f => {
            if (f === "Free") return tagSet.includes("free") || tagSet.includes("open source");
            if (f === "Open Source") return tagSet.includes("open source");
            if (f === "Web") return tagSet.includes("web");
            if (f === "CLI") return tagSet.includes("terminal") || tagSet.includes("cli");
            if (f === "AI") return tagSet.includes("ai");
            return true;
          });
          if (!passes) return false;
        }

        if (activeTab === "Favorites") {
          return favorites.includes(tool.id);
        }

        const matchesCategory = tool.category === activeTab;
        const matchesSubcategory = activeSubTab === "All" || tool.subcategory === activeSubTab;
        return matchesCategory && matchesSubcategory;
      });

      const exportFavorites = () => {
        const data = {
          version: "2.1",
          exportedAt: new Date().toISOString(),
          favorites: favorites,
          tools: tools.filter(t => favorites.includes(t.id)).map(t => ({
            id: t.id,
            name: t.name,
            url: t.url,
            category: t.category
          }))
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `osint-favorites-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        setShowExportModal(false);
      };

      const importFavorites = () => {
        try {
          const data = JSON.parse(importText);
          if (data.favorites && Array.isArray(data.favorites)) {
            setFavorites(prev => [...new Set([...prev, ...data.favorites])]);
            setShowImportModal(false);
            setImportText("");
            alert(`Imported ${data.favorites.length} favorites successfully.`);
          } else {
            alert("Invalid format. Expected a JSON object with a 'favorites' array.");
          }
        } catch (e) {
          alert("Failed to parse JSON. Please check the file content.");
        }
      };

      const toggleTheme = () => {
        setTheme(prev => prev === "dark" ? "light" : "dark");
      };

      return (
        <div className="container">
          <header>
            <div className="header-top">
              <div className="header-title">
                <h1>OSINT Framework</h1>
                <span className="version-tag">v2.1</span>
              </div>
              <div className="header-actions">
                <button className="icon-btn" onClick={toggleTheme} title="Toggle theme">
                  {theme === "dark" ? "☀️ Light" : "🌙 Dark"}
                </button>
                <button className="icon-btn" onClick={() => setShowExportModal(true)} title="Export favorites">
                  📤 Export
                </button>
                <button className="icon-btn" onClick={() => setShowImportModal(true)} title="Import favorites">
                  📥 Import
                </button>
              </div>
            </div>

            <input
              type="text"
              className="search-bar"
              placeholder="Search tools, tags, subcategories... (e.g. 'shadow', 'CLI', 'AI')"
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
            />

            <div className="quick-filters">
              {["Free", "Open Source", "Web", "CLI", "AI"].map(f => (
                <button
                  key={f}
                  className={`filter-chip ${activeQuickFilters.includes(f) ? "active" : ""}`}
                  onClick={() => toggleQuickFilter(f)}
                >
                  {f}
                </button>
              ))}
              {activeQuickFilters.length > 0 && (
                <button className="filter-chip" onClick={() => setActiveQuickFilters([])}>
                  Clear filters
                </button>
              )}
            </div>
          </header>

          {searchQuery === "" && (
            <>
              <div className="nav-tabs">
                {categories.map(category => (
                  <button
                    key={category}
                    className={`tab-btn ${activeTab === category ? "active" : ""}`}
                    onClick={() => handleTabChange(category)}
                  >
                    {category === "Favorites" ? "★ Favorites" : category}
                    <span className="count-badge">{categoryCounts[category] || 0}</span>
                  </button>
                ))}
              </div>

              {availableSubcategories.length > 1 && (
                <div className="sub-tabs">
                  {availableSubcategories.map(subCat => (
                    <button
                      key={subCat}
                      className={`sub-tab-btn ${activeSubTab === subCat ? "active" : ""}`}
                      onClick={() => setActiveSubTab(subCat)}
                    >
                      {subCat}
                    </button>
                  ))}
                </div>
              )}
            </>
          )}

          <div className="stats-bar">
            Showing {filteredTools.length} tool{filteredTools.length !== 1 ? "s" : ""}
            {searchQuery && ` matching "${searchQuery}"`}
            {activeQuickFilters.length > 0 && ` • Filters: ${activeQuickFilters.join(", ")}`}
          </div>

          <div className="tools-grid">
            {filteredTools.length > 0 ? (
              filteredTools.map(tool => (
                <div key={tool.id} className="card">
                  <div>
                    <div className="card-header">
                      <span className="subcategory-label">{tool.subcategory}</span>
                      <button
                        className={`fav-btn ${favorites.includes(tool.id) ? "active" : ""}`}
                        onClick={() => toggleFavorite(tool.id)}
                        title="Toggle Favorite"
                      >
                        ★
                      </button>
                    </div>
                    <h3 className="card-title">{tool.name}</h3>
                    <p className="card-description">{tool.description}</p>
                  </div>

                  <div>
                    <div className="card-tags">
                      {tool.tags.map((tag, i) => (
                        <span key={i} className="tag" onClick={() => handleTagClick(tag)} title="Click to filter by this tag">
                          {tag}
                        </span>
                      ))}
                    </div>
                    <div className="card-footer">
                      <a href={tool.url} target="_blank" rel="noopener noreferrer" className="action-link">
                        Launch Tool ↗
                      </a>
                    </div>
                  </div>
                </div>
              ))
            ) : (
              <div className="empty-state">
                <p>No tools found matching your current selection or search criteria.</p>
                <p style={{ marginTop: "0.5rem", fontSize: "0.85rem" }}>
                  Try clearing filters or searching for something else.
                </p>
              </div>
            )}
          </div>

          {/* Export Modal */}
          {showExportModal && (
            <div className="modal-overlay" onClick={() => setShowExportModal(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3>Export Favorites</h3>
                <p>
                  Download your starred tools as a JSON file. You can import this file later on any device.
                </p>
                <p style={{ fontSize: "0.85rem" }}>
                  Currently starred: <strong>{favorites.length}</strong> tools
                </p>
                <div className="modal-actions">
                  <button className="btn" onClick={() => setShowExportModal(false)}>Cancel</button>
                  <button className="btn btn-primary" onClick={exportFavorites} disabled={favorites.length === 0}>
                    Download JSON
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Import Modal */}
          {showImportModal && (
            <div className="modal-overlay" onClick={() => setShowImportModal(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3>Import Favorites</h3>
                <p>Paste the contents of a previously exported favorites JSON file below.</p>
                <textarea
                  value={importText}
                  onChange={e => setImportText(e.target.value)}
                  placeholder='{"version":"2.1","favorites":["1","2",...]}'
                  style={{
                    width: "100%",
                    height: "120px",
                    background: "var(--bg-color)",
                    border: "1px solid var(--border-color)",
                    borderRadius: "6px",
                    color: "var(--text-main)",
                    padding: "0.6rem",
                    fontSize: "0.8rem",
                    fontFamily: "monospace",
                    resize: "vertical"
                  }}
                />
                <div className="modal-actions">
                  <button className="btn" onClick={() => { setShowImportModal(false); setImportText(""); }}>Cancel</button>
                  <button className="btn btn-primary" onClick={importFavorites}>Import</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
